{% extends "layout.html" %}

{% block main %}
    <div class="validacao">
        <h1>Validação de votação e direção</h1>

        <form method="POST">
            <label>
                Nome:
                <input type="text" name="nome" value="{{ nome }}" placeholder="Digite seu nome" required>
            </label>

            <label>
                Sobrenome:
                <input type="text" name="sobrenome" value="{{ sobrenome }}" placeholder="Digite seu sobrenome" required>
            </label>

            <label>
                Idade:
                <input type="number" name="idade" value="{{ idade }}" min="0" required>
            </label>

            <button type="submit">Validar</button>
        </form>

        {% if mensagem %}
            <div class="resultado">
                <h3>Resultado</h3>
                <p>{{ mensagem }}</p>
                <ul>
                    <li>Votar: {{ 'Sim' if pode_votar else 'Não' }}</li>
                    <li>Dirigir: {{ 'Sim' if pode_dirigir else 'Não' }}</li>
                </ul>
            </div>
        {% endif %}
    </div>
{% endblock %}
